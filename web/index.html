<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>自动剧本生成机 · 交互层</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e6e8ec;
    --text-dim: #9aa1ad;
    --accent: #6ea8fe;
    --want: #4caf7d;
    --obstacle: #e0665b;
    --warn: #d9a441;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    color: var(--text-dim);
    white-space: nowrap;
  }
  select, input[type=text], button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
  }
  button {
    cursor: pointer;
    background: var(--accent);
    color: #0f1115;
    font-weight: 600;
    border: none;
  }
  button:hover { opacity: 0.9; }
  button.secondary {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .state-badge {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .state-badge.confirmed { color: var(--want); border-color: var(--want); }
  .state-badge.collecting { color: var(--accent); border-color: var(--accent); }
  .state-badge.candidates_pending { color: var(--warn); border-color: var(--warn); }

  main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  .chat-col {
    flex: 1.3;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    min-width: 320px;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 78%;
    padding: 10px 13px;
    border-radius: 10px;
    line-height: 1.55;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: #0f1115;
  }
  .msg.brain {
    align-self: flex-start;
    background: var(--panel-2);
    border: 1px solid var(--border);
  }
  .msg.system {
    align-self: center;
    color: var(--text-dim);
    font-size: 12px;
    background: none;
  }
  .msg .tag {
    display: block;
    font-size: 11px;
    opacity: 0.7;
    margin-bottom: 4px;
  }
  .input-row {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  .input-row input {
    flex: 1;
    padding: 10px 12px;
    font-size: 14px;
  }

  .schema-col {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    background: var(--panel);
    min-width: 300px;
  }
  .schema-col h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin: 18px 0 8px;
  }
  .schema-col h2:first-child { margin-top: 0; }
  .card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 13px;
    line-height: 1.5;
  }
  .card .label {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 3px;
  }
  .pill {
    display: inline-block;
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 999px;
    margin-left: 6px;
  }
  .pill.want { background: rgba(76,175,125,0.15); color: var(--want); }
  .pill.obstacle { background: rgba(224,102,91,0.15); color: var(--obstacle); }
  .pill.unclear { background: rgba(154,161,173,0.15); color: var(--text-dim); }
  .pill.assumption { background: rgba(217,164,65,0.15); color: var(--warn); }
  .empty-hint { color: var(--text-dim); font-size: 13px; }
  .card.editable { cursor: pointer; transition: border-color 0.15s, background 0.15s; }
  .card.editable:hover { border-color: var(--accent); background: rgba(110,168,254,0.07); }
  .card.editable::after {
    content: "点击针对此项修改 ✎";
    display: block;
    margin-top: 6px;
    font-size: 11px;
    color: var(--accent);
    opacity: 0;
    transition: opacity 0.15s;
  }
  .card.editable:hover::after { opacity: 0.85; }
  .flag-box {
    border: 1px solid var(--obstacle);
    background: rgba(224,102,91,0.08);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
    margin-bottom: 10px;
    color: var(--obstacle);
  }
  .write-section {
    background: var(--panel-2);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 14px;
  }
  .write-section .btn-row { display: flex; gap: 8px; margin: 8px 0; }
  .write-section button { flex: 1; }
  .draft-item {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 10px;
    margin-bottom: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  .draft-item:hover { border-color: var(--accent); }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 50;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: min(720px, 90vw);
    max-height: 85vh;
    display: flex;
    flex-direction: column;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .modal-header h3 { margin: 0; font-size: 14px; color: var(--text-dim); }
  .modal-body {
    padding: 16px;
    overflow-y: auto;
    white-space: pre-wrap;
    line-height: 1.7;
    font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <h1>自动剧本生成机</h1>
  <select id="projectSelect"></select>
  <input type="text" id="newProjectName" placeholder="新项目名..." style="width:120px" />
  <select id="predecessorSelect" style="width:150px">
    <option value="">承接自: 无（全新故事）</option>
  </select>
  <button id="newProjectBtn" class="secondary">新建</button>
  <span id="stateBadge" class="state-badge">-</span>
  <button id="deleteProjectBtn" class="secondary" style="margin-left:auto;color:var(--obstacle);border-color:var(--obstacle)">删除当前项目</button>
</header>

<main>
  <div class="chat-col">
    <div class="messages" id="messages"></div>
    <div class="input-row">
      <input type="text" id="userInput" placeholder="跟 brain 聊聊你想写的剧本..." />
      <button id="sendBtn">发送</button>
      <button id="statusBtn" class="secondary">状态</button>
    </div>
  </div>

  <div class="schema-col" id="schemaCol">
    <div class="empty-hint">选择或新建一个项目开始</div>
  </div>
</main>

<div class="modal-overlay" id="draftModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="draftModalTitle">正文</h3>
      <button id="draftModalClose" class="secondary">关闭</button>
    </div>
    <div class="modal-body" id="draftModalBody"></div>
  </div>
</div>

<script>
const API = "/api";
let currentProject = null;

const $ = (id) => document.getElementById(id);

function esc(v) {
  if (v === null || v === undefined) return "";
  return String(v)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}
function escAttr(v) {
  return esc(v).replace(/"/g, "&quot;");
}
function focusInputWith(hint) {
  const input = $("userInput");
  input.value = hint + " ";
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
}
const messagesEl = $("messages");
const schemaEl = $("schemaCol");
const stateBadge = $("stateBadge");
const projectSelect = $("projectSelect");

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  if (role === "brain") {
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = "brain";
    div.appendChild(tag);
  }
  const body = document.createElement("div");
  body.textContent = text;
  div.appendChild(body);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addSystemMessage(text) {
  const div = document.createElement("div");
  div.className = "msg system";
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function loadProjects(selectName) {
  const res = await fetch(`${API}/projects`);
  const data = await res.json();

  projectSelect.innerHTML = "";
  const placeholder = document.createElement("option");
  placeholder.value = "";
  placeholder.textContent = data.projects.length ? "选择已有项目..." : "（暂无项目）";
  projectSelect.appendChild(placeholder);

  const predecessorSelect = $("predecessorSelect");
  predecessorSelect.innerHTML = '<option value="">承接自: 无（全新故事）</option>';

  // 按 series（系列根，即链条最初那一幕）分组，同一个系列用 optgroup 包起来，
  // 视觉上就能看出"这几幕是一个系列"，不用打开元数据才知道。
  const groups = new Map();
  for (const p of data.projects) {
    if (!groups.has(p.series)) groups.set(p.series, []);
    groups.get(p.series).push(p);

    const predOpt = document.createElement("option");
    predOpt.value = p.name;
    predOpt.textContent = p.name;
    predecessorSelect.appendChild(predOpt);
  }

  for (const [series, members] of groups) {
    // 只有一个成员、且它自己就是系列根（没有 predecessor）：说明是独立项目，
    // 不值得单独包一层 optgroup，直接平铺显示更干净。
    const isStandalone = members.length === 1 && !members[0].predecessor;
    const container = isStandalone
      ? projectSelect
      : (() => {
          const g = document.createElement("optgroup");
          g.label = `系列: ${series}`;
          projectSelect.appendChild(g);
          return g;
        })();

    for (const p of members) {
      const opt = document.createElement("option");
      opt.value = p.name;
      // 分组只能看出"同一伙"，看不出方向——文字里的 "← 承接自 X" 才是明确的
      // 衔接方向标识，尤其链条长了之后（A→B→C）不能只靠视觉分组来传达顺序。
      const tail = p.predecessor ? ` ← ${p.predecessor}` : "";
      opt.textContent = isStandalone ? `${p.name} (${p.state})` : `　${p.name} (${p.state})${tail}`;
      container.appendChild(opt);
    }
  }

  if (selectName) projectSelect.value = selectName;
}

async function openProject(name) {
  currentProject = name;
  messagesEl.innerHTML = "";
  const [snapRes, logRes] = await Promise.all([
    fetch(`${API}/projects/${encodeURIComponent(name)}`),
    fetch(`${API}/projects/${encodeURIComponent(name)}/log`),
  ]);
  const snapshot = await snapRes.json();
  const logData = await logRes.json();

  for (const entry of logData.log) {
    addMessage(entry.role === "user" ? "user" : "brain", entry.content);
  }
  if (logData.log.length === 0) {
    if (snapshot._meta.predecessor) {
      addSystemMessage(`新项目 "${name}"，承接自「${snapshot._meta.predecessor}」的结局。这一幕想往哪个方向走？`);
    } else {
      addSystemMessage(`新项目 "${name}"，想聊聊你想写个什么样的剧本吗？`);
    }
  }
  renderSchema(snapshot);
}

function renderSchema(snapshot) {
  const state = snapshot._meta.project_state;
  stateBadge.textContent = state;
  stateBadge.className = "state-badge " + state;

  let html = '<div id="writeSection"></div>';

  if (snapshot._meta.flagged_injection) {
    html += `<div class="flag-box">⚠ 检测到疑似注入内容：${
      (snapshot._meta.flagged_snippets || []).join("; ")
    }</div>`;
  }
  if (snapshot._meta.conflicts_flagged && snapshot._meta.conflicts_flagged.length) {
    for (const c of snapshot._meta.conflicts_flagged) {
      html += `<div class="flag-box">⚠ 潜在矛盾（${(c.fields||[]).join(" / ")}）：${c.description||""}</div>`;
    }
  }

  if (snapshot._meta.predecessor) {
    html += `<h2>承接自</h2>
      <div class="card"><b>${esc(snapshot._meta.predecessor)}</b><br/>
      <span class="label">上一幕结局摘要</span><br/>${esc(snapshot._meta.continuity_recap) || "-"}</div>`;
  }

  if (snapshot.candidates && snapshot.candidates.length) {
    html += `<h2>候选方向</h2>`;
    snapshot.candidates.forEach((c, i) => {
      html += `<div class="card"><div class="label">候选 ${i+1}</div>
        <b>Want:</b> ${c.want || "-"}<br/>
        <b>Obstacle:</b> ${c.obstacle || "-"}<br/>
        ${c.pitch ? `<i>${c.pitch}</i>` : ""}
      </div>`;
    });
  }

  html += `<h2>主线 (Throughline)</h2>`;
  if (snapshot.throughline) {
    html += `<div class="card editable" data-hint="${escAttr('关于「主线（want/obstacle）」，我想')}">
      <div class="label">Want</div>${esc(snapshot.throughline.want) || "-"}<br/><br/>
      <div class="label">Obstacle</div>${esc(snapshot.throughline.obstacle) || "-"}<br/><br/>
      <div class="label">Stakes</div>${esc(snapshot.throughline.stakes) || "-"}
    </div>`;
  } else {
    html += `<div class="empty-hint">尚未确立</div>`;
  }

  const rb = snapshot.rule_based || {};
  html += `<h2>角色</h2>`;
  if (rb.characters && rb.characters.length) {
    for (const c of rb.characters) {
      const pillClass = c.embodies === "want" ? "want" : c.embodies === "obstacle" ? "obstacle" : "unclear";
      const pillText = c.embodies || c.relation_to_throughline;
      const label = c.name ? `${c.role}（${c.name}）` : c.role;
      html += `<div class="card editable" data-hint="${escAttr(`关于角色「${label}」，我想`)}">
        <b>${esc(c.role) || ""}</b> ${c.name ? "· " + esc(c.name) : ""}
        <span class="pill ${pillClass}">${pillText}</span><br/>
        <span class="label">${c.type || "human"}${c.profession ? " · " + esc(c.profession) : ""}</span>
      </div>`;
    }
  } else {
    html += `<div class="empty-hint">暂无</div>`;
  }
  html += `<div class="card editable" data-hint="${escAttr('我想新增一个角色：')}" style="text-align:center;color:var(--accent)">+ 新增角色</div>`;

  html += `<h2>子情节</h2>`;
  if (snapshot.sub_intents && snapshot.sub_intents.length) {
    for (const s of snapshot.sub_intents) {
      const shortText = (s.text || "").slice(0, 12);
      html += `<div class="card editable" data-hint="${escAttr(`关于子情节「${shortText}…」，我想`)}">
        ${esc(s.text)}<br/>
        <span class="label">负责: ${esc(s.assigned_character) || "-"} · 局部阻力: ${esc(s.local_obstacle) || "-"}</span>
      </div>`;
    }
  } else {
    html += `<div class="empty-hint">暂无</div>`;
  }
  html += `<div class="card editable" data-hint="${escAttr('我想新增一条子情节：')}" style="text-align:center;color:var(--accent)">+ 新增子情节</div>`;

  html += `<h2>规则型字段</h2>`;
  html += `<div class="card editable" data-hint="${escAttr('关于「规则型设定（类型/基调/篇幅/场景/必含/禁止）」，我想')}">
    <div class="label">类型 / 基调</div>${esc(rb.genre) || "-"} / ${esc(rb.tone) || "-"}<br/><br/>
    <div class="label">篇幅</div>${rb.length ? `${rb.length.target}${rb.length.unit} (±${rb.length.tolerance})` : "-"}<br/><br/>
    <div class="label">场景</div>${rb.setting ? `${esc(rb.setting.location)||"-"} / ${esc(rb.setting.time_period)||"-"}` : "-"}<br/><br/>
    <div class="label">必含</div>${(rb.must_include||[]).map(esc).join("、") || "-"}<br/><br/>
    <div class="label">禁止</div>${(rb.must_avoid||[]).map(esc).join("、") || "-"}
  </div>`;

  html += `<h2>假设（推断，非用户锁定）</h2>`;
  if (snapshot.assumptions && snapshot.assumptions.length) {
    for (const a of snapshot.assumptions) {
      html += `<div class="card">
        <span class="pill assumption">assumption</span> <b>${a.field}</b>: ${
          typeof a.value === "object" ? JSON.stringify(a.value) : a.value
        }<br/>
        <span class="label">依据: ${a.basis}</span>
      </div>`;
    }
  } else {
    html += `<div class="empty-hint">暂无</div>`;
  }

  schemaEl.innerHTML = html;

  if (state === "confirmed") {
    renderWriteSection();
  }
}

async function renderWriteSection() {
  const container = document.getElementById("writeSection");
  if (!container || !currentProject) return;

  const res = await fetch(`${API}/projects/${encodeURIComponent(currentProject)}/drafts`);
  const data = await res.json();

  let html = `<div class="write-section">
    <div class="label">生成正文</div>
    <div class="btn-row">
      <button class="gen-btn" data-mode="novel">生成小说</button>
      <button class="gen-btn" data-mode="screenplay">生成剧本</button>
    </div>
    <div class="label" style="margin-top:8px">批量补齐系列里还没生成的幕次</div>
    <div class="btn-row">
      <button class="batch-gen-btn secondary" data-mode="novel">批量生成小说</button>
      <button class="batch-gen-btn secondary" data-mode="screenplay">批量生成剧本</button>
    </div>`;

  // 参考的上一幕版本，跟上一幕现在的最新版本对不上了——说明上一幕后来又
  // 重新生成过，这一幕的文风/事实参考已经过期，提示但不阻止任何操作。
  for (const mode of ["novel", "screenplay"]) {
    const s = data.staleness && data.staleness[mode];
    if (s && s.stale) {
      const modeLabel = mode === "novel" ? "小说" : "剧本";
      html += `<div class="flag-box">⚠ 这一幕的${modeLabel}正文是参考上一幕的「${esc(s.generated_from || "无")}」生成的，
        但上一幕现在的最新版本是「${esc(s.predecessor_latest || "无")}」，参考的内容可能已经过期，
        建议重新生成这一幕。</div>`;
    }
  }

  if (data.drafts && data.drafts.length) {
    html += `<div class="label" style="margin-top:8px">已生成的版本（点击查看，× 删除）</div>`;
    for (const f of data.drafts) {
      html += `<div style="display:flex;gap:4px;align-items:center;margin-bottom:6px">
        <button class="draft-item" data-filename="${escAttr(f)}" style="flex:1;margin-bottom:0">${esc(f)}</button>
        <button class="draft-delete-btn secondary" data-filename="${escAttr(f)}" style="flex:0 0 auto;padding:6px 10px;color:var(--obstacle)">×</button>
      </div>`;
    }
  }
  html += `<div class="label" style="margin-top:8px">导出整个系列（拼接已有各幕正文，不调用模型）</div>
    <div class="btn-row">
      <button class="compile-btn secondary" data-mode="novel">导出小说全集</button>
      <button class="compile-btn secondary" data-mode="screenplay">导出剧本全集</button>
    </div>`;
  html += `</div>`;
  container.innerHTML = html;
}

function openDraftModal(title, content) {
  $("draftModalTitle").textContent = title;
  $("draftModalBody").textContent = content;
  $("draftModal").classList.add("open");
}

async function callWrite(mode, force) {
  const res = await fetch(`${API}/projects/${encodeURIComponent(currentProject)}/write`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ mode, force }),
  });
  return res.json();
}

schemaEl.addEventListener("click", async (e) => {
  const genBtn = e.target.closest(".gen-btn");
  if (genBtn && currentProject) {
    const mode = genBtn.dataset.mode;
    const modeLabel = mode === "novel" ? "小说" : "剧本";
    genBtn.disabled = true;
    genBtn.textContent = "生成中…";
    try {
      let data = await callWrite(mode, false);
      if (data.error) {
        addSystemMessage("生成失败: " + data.error);
        return;
      }
      if (data.needs_confirmation) {
        let msg = `「${currentProject}」已经有${modeLabel}正文了，重新生成会存成新版本。`;
        if (data.dependents && data.dependents.length) {
          msg += `\n\n⚠ 已经有幕次承接自它并参考它生成过正文：${data.dependents.join("、")}。` +
            `重新生成这一幕后，它们参考的还是旧版本，可能出现新的不一致，` +
            `建议重新生成完这一幕后也考虑重新生成它们。`;
        }
        if (!confirm(msg + "\n\n确定要重新生成吗？")) return;
        data = await callWrite(mode, true);
        if (data.error) {
          addSystemMessage("生成失败: " + data.error);
          return;
        }
      }
      if (data.continued_from_draft) {
        addSystemMessage("已参考上一幕的正文来保持文风衔接。");
      }
      if (data.chapters && data.chapters.length > 1) {
        const truncated = data.chapters.filter(c => c.finish_reason === "length").length;
        let msg = `篇幅较长，自动分成了 ${data.chapters.length} 段生成，段与段之间已做衔接。`;
        if (truncated) msg += `\n⚠ 其中 ${truncated} 段被截断了，不是正常写完的，可以考虑重新生成。`;
        addSystemMessage(msg);
      }
      openDraftModal(data.filename, data.content);
      renderWriteSection();
    } catch (err) {
      addSystemMessage("生成失败: " + err);
    } finally {
      genBtn.disabled = false;
      genBtn.textContent = mode === "novel" ? "生成小说" : "生成剧本";
    }
    return;
  }

  const batchBtn = e.target.closest(".batch-gen-btn");
  if (batchBtn && currentProject) {
    const mode = batchBtn.dataset.mode;
    batchBtn.disabled = true;
    batchBtn.textContent = "批量生成中…（可能需要几分钟）";
    try {
      const res = await fetch(`${API}/projects/${encodeURIComponent(currentProject)}/write_series`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mode }),
      });
      const data = await res.json();
      if (data.error) {
        addSystemMessage("批量生成失败: " + data.error);
      } else {
        const lines = data.results.map(r => {
          if (r.status === "written") return `✓ ${r.name}: 已生成 ${r.filename}`;
          if (r.status === "skipped_exists") return `- ${r.name}: 已有正文，跳过`;
          return `✗ ${r.name}: 还没收尾，停在这里`;
        });
        addSystemMessage("批量生成结果：\n" + lines.join("\n"));
        renderWriteSection();
      }
    } catch (err) {
      addSystemMessage("批量生成失败: " + err);
    } finally {
      batchBtn.disabled = false;
      batchBtn.textContent = mode === "novel" ? "批量生成小说" : "批量生成剧本";
    }
    return;
  }

  const draftBtn = e.target.closest(".draft-item");
  if (draftBtn && currentProject) {
    const filename = draftBtn.dataset.filename;
    const res = await fetch(`${API}/projects/${encodeURIComponent(currentProject)}/drafts/${encodeURIComponent(filename)}`);
    const data = await res.json();
    if (data.error) {
      addSystemMessage("加载失败: " + data.error);
    } else {
      openDraftModal(data.filename, data.content);
    }
    return;
  }

  const deleteBtn = e.target.closest(".draft-delete-btn");
  if (deleteBtn && currentProject) {
    const filename = deleteBtn.dataset.filename;
    if (!confirm(`确定要删除「${filename}」吗？此操作不可撤销。`)) return;
    const res = await fetch(
      `${API}/projects/${encodeURIComponent(currentProject)}/drafts/${encodeURIComponent(filename)}`,
      { method: "DELETE" }
    );
    const data = await res.json();
    if (data.error) {
      addSystemMessage("删除失败: " + data.error);
    } else {
      addSystemMessage(`已删除 ${filename}`);
      renderWriteSection();
    }
    return;
  }

  const compileBtn = e.target.closest(".compile-btn");
  if (compileBtn && currentProject) {
    const mode = compileBtn.dataset.mode;
    const res = await fetch(`${API}/projects/${encodeURIComponent(currentProject)}/compile?mode=${mode}`);
    const data = await res.json();
    if (data.error) {
      addSystemMessage("导出失败: " + data.error);
    } else {
      openDraftModal(`系列全集 (${data.chain.join(" → ")})`, data.content);
    }
  }
});

$("draftModalClose").addEventListener("click", () => {
  $("draftModal").classList.remove("open");
});
$("draftModal").addEventListener("click", (e) => {
  if (e.target.id === "draftModal") $("draftModal").classList.remove("open");
});

async function sendMessage(text) {
  if (!currentProject) {
    addSystemMessage("请先选择或新建一个项目");
    return;
  }
  addMessage("user", text);
  $("sendBtn").disabled = true;
  const thinkingId = "thinking-" + Date.now();
  addSystemMessage("brain 正在思考…");

  try {
    const res = await fetch(`${API}/projects/${encodeURIComponent(currentProject)}/message`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    const data = await res.json();
    messagesEl.lastChild.remove(); // 去掉"正在思考"
    if (data.error) {
      addSystemMessage("出错: " + data.error);
      return;
    }
    addMessage("brain", data.reply || "");
    renderSchema(data.snapshot);
    loadProjects(currentProject);
  } catch (e) {
    messagesEl.lastChild.remove();
    addSystemMessage("请求失败: " + e);
  } finally {
    $("sendBtn").disabled = false;
  }
}

$("sendBtn").addEventListener("click", () => {
  const input = $("userInput");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  sendMessage(text);
});

$("userInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") $("sendBtn").click();
});

$("statusBtn").addEventListener("click", async () => {
  if (!currentProject) return;
  const res = await fetch(`${API}/projects/${encodeURIComponent(currentProject)}`);
  const snapshot = await res.json();
  renderSchema(snapshot);
  addSystemMessage("已刷新右侧当前状态（未消耗模型调用）");
});

$("newProjectBtn").addEventListener("click", async () => {
  const name = $("newProjectName").value.trim();
  if (!name) return;
  const predecessor = $("predecessorSelect").value;

  if (predecessor) {
    // 衔接关系一旦建立，界面上没有"解除关联"的操作（只能删掉这一幕重建），
    // 属于不好撤销的操作，需要用户明确确认，而不是选完下拉框直接点新建就生效。
    const confirmMsg =
      `确定要让新剧本「${name}」承接自「${predecessor}」的结局吗？\n\n` +
      `会自动继承「${predecessor}」的角色/场景设定（want/obstacle 需要重新聊），` +
      `两者会归入同一个系列文件夹。这个承接关系建立后无法在界面上更改，` +
      `只能删除「${name}」重新创建。`;
    if (!confirm(confirmMsg)) return;
  }

  $("newProjectName").value = "";
  $("predecessorSelect").value = "";

  if (predecessor) {
    let res = await fetch(`${API}/projects/${encodeURIComponent(name)}/continue_from`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ predecessor, force: false }),
    });
    let data = await res.json();
    if (data.error) {
      addSystemMessage("新建失败: " + data.error);
      return;
    }

    // predecessor 已经有幕次接过它了——很可能选错了（想要的是最新一幕，
    // 不是这个），单独提醒一次，不是"能不能建"的问题，是"这真的是你要的吗"。
    if (data.needs_confirmation) {
      const msg =
        `「${predecessor}」已经有幕次承接自它了：${data.existing_successors.join("、")}。\n` +
        `这条链目前最新的一幕是：${data.leaf_suggestions.join("、")}。\n\n` +
        `确定要从「${predecessor}」（不是最新的）另开一个分支吗？` +
        `通常应该选最新那幕续写，除非你就是想要一个新分支。`;
      if (!confirm(msg)) return;
      res = await fetch(`${API}/projects/${encodeURIComponent(name)}/continue_from`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ predecessor, force: true }),
      });
      data = await res.json();
      if (data.error) {
        addSystemMessage("新建失败: " + data.error);
        return;
      }
    }
  }

  await openProject(name);
  await loadProjects(name);
});

$("deleteProjectBtn").addEventListener("click", async () => {
  if (!currentProject) {
    addSystemMessage("请先选一个项目再删除");
    return;
  }
  const name = currentProject;

  // 第一次调用不带 force，只拿依赖信息，不会真的删
  let res = await fetch(`${API}/projects/${encodeURIComponent(name)}`, { method: "DELETE" });
  let data = await res.json();
  if (data.error) {
    addSystemMessage("删除失败: " + data.error);
    return;
  }

  let msg = `确定要删除「${name}」吗？此操作不可撤销，快照和聊天记录都会被永久删除。`;
  if (data.predecessor) {
    msg += `\n\n这一幕承接自「${data.predecessor}」。`;
  }
  if (data.successors && data.successors.length) {
    msg += `\n\n⚠ 有其他幕承接自这一幕：${data.successors.join("、")}。` +
      `删除后它们不会功能损坏（角色/场景设定已经各自独立保存了一份），` +
      `但会失去溯源指向（显示"承接自一个已删除的项目"），` +
      `而且这一幕自己独有的剧情内容会永久丢失，是这个系列衔接链条里的一环。`;
  }

  if (!confirm(msg)) return;

  // 用户确认后，带 force=true 再调一次才真正执行删除
  res = await fetch(`${API}/projects/${encodeURIComponent(name)}?force=true`, { method: "DELETE" });
  data = await res.json();
  if (data.error) {
    addSystemMessage("删除失败: " + data.error);
    return;
  }

  currentProject = null;
  messagesEl.innerHTML = "";
  schemaEl.innerHTML = '<div class="empty-hint">选择或新建一个项目开始</div>';
  stateBadge.textContent = "-";
  stateBadge.className = "state-badge";
  addSystemMessage(`已删除「${name}」`);
  await loadProjects();
});

projectSelect.addEventListener("change", () => {
  if (projectSelect.value) openProject(projectSelect.value);
});

// 点击右侧任意可编辑卡片：只聚焦并预填输入框，不调用模型，不做"确认"往返
schemaEl.addEventListener("click", (e) => {
  const card = e.target.closest(".card.editable");
  if (!card) return;
  const hint = card.getAttribute("data-hint");
  if (hint) focusInputWith(hint);
});

loadProjects();
</script>
